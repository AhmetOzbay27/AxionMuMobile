<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kanıt Görüntüleyici</title>
<style>
  html,body { margin:0; padding:0; background:#111; }
  .wrap { position:relative; overflow:hidden; width:1280px; height:720px; }
  .wrap img { position:absolute; image-rendering:pixelated; }
</style>
</head>
<body>
  <div class="wrap">
    <img id="img" src="shots/run19-e2e-local-t20s.png" style="left:0; top:0; width:2560px; height:auto;">
  </div>
  <script>
    // URL parametreleri: ?img=...&x=&y=&zoom=
    const q = new URLSearchParams(location.search);
    const img = document.getElementById('img');
    const wrap = document.querySelector('.wrap');
    if (q.get('img')) img.src = q.get('img');
    const zoom = parseFloat(q.get('zoom') || '2');
    const cx = parseFloat(q.get('x') || '0');
    const cy = parseFloat(q.get('y') || '0');
    img.addEventListener('load', () => {
      img.style.width = (img.naturalWidth * zoom) + 'px';
      img.style.height = 'auto';
      img.style.left = (-cx * zoom) + 'px';
      img.style.top = (-cy * zoom) + 'px';
    });
    if (q.get('w')) wrap.style.width = q.get('w') + 'px';
    if (q.get('h')) wrap.style.height = q.get('h') + 'px';
  </script>
</body>
</html>
